name: ferreteriabimetalica
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Configuración de flutter_launcher_icons (DEBE IR AQUÍ, FUERA del bloque flutter)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/bimetalica_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/branding/bimetalica_icon.png